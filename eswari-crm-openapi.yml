  /api/ase-leads/:
    get:
      operationId: api_ase_leads_list
      description: ViewSet for managing ASE Leads
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: integer
      - in: query
        name: created_by
        schema:
          type: integer
      - in: query
        name: has_social_media
        schema:
          type: boolean
      - in: query
        name: has_website
        schema:
          type: boolean
      - in: query
        name: industry
        schema:
          type: string
          enum:
          - automotive
          - education
          - entertainment
          - fashion
          - finance
          - food_beverage
          - healthcare
          - hospitality
          - manufacturing
          - non_profit
          - other
          - professional_services
          - real_estate
          - retail
          - sports_fitness
          - technology
        description: |-
          Industry sector

          * `technology` - Technology
          * `healthcare` - Healthcare
          * `finance` - Finance
          * `retail` - Retail & E-commerce
          * `real_estate` - Real Estate
          * `education` - Education
          * `hospitality` - Hospitality & Tourism
          * `manufacturing` - Manufacturing
          * `professional_services` - Professional Services
          * `non_profit` - Non-Profit
          * `automotive` - Automotive
          * `food_beverage` - Food & Beverage
          * `fashion` - Fashion & Beauty
          * `sports_fitness` - Sports & Fitness
          * `entertainment` - Entertainment & Media
          * `other` - Other
      - in: query
        name: is_disabled
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
          - urgent
        description: |-
          Priority level

          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `urgent` - Urgent
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - custom
          - demo_done
          - new
          - presentation
          - quotation
        description: |-
          Current status

          * `new` - New Lead
          * `demo_done` - Demo Done
          * `presentation` - Presentation
          * `quotation` - Quotation
          * `custom` - Custom
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedASELeadListList'
          description: ''
    post:
      operationId: api_ase_leads_create
      description: ViewSet for managing ASE Leads
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ASELeadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ASELeadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ASELeadRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ASELead'
          description: ''
