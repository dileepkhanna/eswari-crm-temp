    PatchedASELeadRequest:
      type: object
      description: |-
        Serializer for ASE Lead model with all new marketing team fields.

        Nested relationships included (all read-only):
        - researched_by_details / contacted_by_details / managed_by_details
          → UserBasicSerializer: human-readable user info for role assignments
        - recent_activities
          → last 5 activities on this lead (ASELeadActivityListSerializer)
        - pending_tasks
          → open/in-progress tasks for this lead (ASELeadTaskListSerializer)
      properties:
        company_name:
          type: string
          minLength: 1
          description: Company or business name
          maxLength: 255
        contact_person:
          type: string
          minLength: 1
          description: Primary contact person name
          maxLength: 255
        email:
          type: string
          nullable: true
        phone:
          type: string
          minLength: 1
          description: Primary phone number
          maxLength: 20
        website:
          type: string
          format: uri
          nullable: true
          description: Company website URL
          maxLength: 200
        industry:
          allOf:
          - $ref: '#/components/schemas/IndustryEnum'
          description: |-
            Industry sector

            * `technology` - Technology
            * `healthcare` - Healthcare
            * `finance` - Finance
            * `retail` - Retail & E-commerce
            * `real_estate` - Real Estate
            * `education` - Education
            * `hospitality` - Hospitality & Tourism
            * `manufacturing` - Manufacturing
            * `professional_services` - Professional Services
            * `non_profit` - Non-Profit
            * `automotive` - Automotive
            * `food_beverage` - Food & Beverage
            * `fashion` - Fashion & Beauty
            * `sports_fitness` - Sports & Fitness
            * `entertainment` - Entertainment & Media
            * `other` - Other
        company_size:
          type: string
          nullable: true
          description: Number of employees
          maxLength: 50
        annual_revenue:
          type: string
          nullable: true
          description: Annual revenue range
          maxLength: 100
        service_interests:
          description: List of interested services
        custom_services:
          type: string
          nullable: true
          description: Custom services not in predefined list
        current_marketing_spend:
          type: string
          nullable: true
          description: Current monthly marketing spend
          maxLength: 100
        budget_amount:
          type: string
          nullable: true
          description: Budget amount for services
          maxLength: 100
        has_website:
          type: boolean
          description: Does the company have a website?
        has_social_media:
          type: boolean
          description: Active on social media?
        current_seo_agency:
          type: string
          nullable: true
          description: Current SEO/Marketing agency
          maxLength: 255
