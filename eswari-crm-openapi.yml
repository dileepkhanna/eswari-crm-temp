components:
  schemas:
    ASECustomer:
      type: object
      description: Serializer for ASE Customer model (simple version)
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
          description: Customer name (optional)
          maxLength: 255
        phone:
          type: string
          description: Primary phone number (required)
          maxLength: 20
        email:
          type: string
          format: email
          nullable: true
          description: Email address (optional)
          maxLength: 254
        company_name:
          type: string
          nullable: true
          description: Company name (optional)
          maxLength: 255
        call_status:
          allOf:
          - $ref: '#/components/schemas/CallStatusEnum'
          description: |-
            Call status

            * `pending` - Pending
            * `answered` - Answered
            * `not_answered` - Not Answered
            * `busy` - Busy
            * `not_interested` - Not Interested
            * `custom` - Custom
        custom_call_status:
          type: string
          nullable: true
          description: Custom call status
          maxLength: 100
        company:
          type: integer
          nullable: true
          description: Company this customer belongs to
        company_name_display:
          type: string
          readOnly: true
        company_code:
          type: string
          readOnly: true
        assigned_to:
          type: integer
          nullable: true
          description: Assigned team member
        assigned_to_name:
          type: string
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          description: User who created this customer
        created_by_name:
          type: string
          readOnly: true
        scheduled_date:
          type: string
          format: date-time
          nullable: true
          description: Scheduled call date
        call_date:
          type: string
          format: date-time
          nullable: true
          description: Actual call date
        service_interests:
          description: Digital marketing services of interest
        service_interests_display:
          type: string
          readOnly: true
        custom_services:
          type: string
          nullable: true
          description: Custom services not in predefined list
        notes:
          type: string
          nullable: true
          description: Customer notes (max 500 characters)
        is_converted:
          type: boolean
          description: Converted to lead
        converted_lead_id:
          type: string
          nullable: true
          description: ID of converted lead
          maxLength: 50
        is_disabled:
          type: boolean
          description: Set to True when converted to lead - hides from active lists
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_to_name
      - company_code
      - company_name_display
      - created_at
      - created_by
      - created_by_name
      - id
      - phone
      - service_interests_display
      - updated_at
