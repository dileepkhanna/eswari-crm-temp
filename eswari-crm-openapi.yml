  /api/ase-leads/{id}/activities/:
    get:
      operationId: api_ase_leads_activities_retrieve
      description: |-
        List activities for a specific lead with optional filtering and pagination.

        Query Parameters:
          - activity_type (optional): Filter by activity type (call, email, meeting, etc.)
          - page (optional): Page number for pagination (default: 1)

        Returns:
          200 with paginated activity list
          404 if lead not found
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/ase-leads/{id}/activities/create/:
    post:
      operationId: api_ase_leads_activities_create_create
      description: |-
        Create a new activity for a specific lead.

        Request body:
          - activity_type (required): One of call, email, meeting, note, status_change, assignment
          - title (required): Brief summary of the activity
          - description (optional): Detailed description
          - call_duration_minutes (optional): Duration of call in minutes
          - call_outcome (optional): Outcome of the call
          - email_subject (optional): Subject line of the email
          - meeting_date (optional): Scheduled meeting date/time
          - meeting_attendees (optional): List of attendees
          - requires_followup (optional): Whether follow-up is needed
          - followup_date (optional): When follow-up is due

        Returns:
          201 with serialized activity on success
          400 if validation fails
          404 if lead not found
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/ase-leads/{id}/assign-to-boe/:
    post:
      operationId: api_ase_leads_assign_to_boe_create
      description: |-
        Assign a qualified lead to a BOE team member.

        Request body:
          - user_id (required, integer): ID of the BOE user to assign the lead to

        Validations:
          - Lead must exist (404 if not found)
          - Lead must be in 'qualified' status (400 if not)
          - User must have BRE access (403 if not)
          - user_id must be provided (400 if missing)
          - Target user must exist (400 if not found)
          - Target user must be a BOE team member (400 if not)

        Side effects:
          - Sets lead.contacted_by to the target user
          - Updates lead.assigned_to to the target user
          - Creates ASELeadActivity (type='assignment', title='Assigned to BOE')

        Returns:
          200 with serialized lead data on success
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/ase-leads/{id}/assign-to-cre/:
    post:
      operationId: api_ase_leads_assign_to_cre_create
      description: |-
        Assign a contacted/nurturing lead to a CRE team member.

        Request body:
          - user_id (required, integer): ID of the CRE user to assign the lead to

        Validations:
          - Lead must exist (404 if not found)
          - Lead must be in 'contacted' or 'nurturing' status (400 if not)
          - User must have BOE access (403 if not)
          - user_id must be provided (400 if missing)
          - Target user must exist (400 if not found)
          - Target user must be a CRE team member (400 if not)

        Side effects:
          - Sets lead.managed_by to the target user
          - Updates lead.assigned_to to the target user
          - Creates ASELeadActivity (type='assignment', title='Assigned to CRE')

        Returns:
          200 with serialized lead data on success
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/ase-leads/{id}/disqualify/:
    post:
      operationId: api_ase_leads_disqualify_create
      description: |-
        Disqualify a lead — moves it from 'new' to 'lost' status.

        Request body:
          - disqualification_reason (required, string): Reason for disqualification

        Validations:
          - Lead must exist (404 if not found)
          - Lead must be in 'new' status (400 if not)
          - User must have BRE access (403 if not)
          - disqualification_reason must be provided (400 if missing)

        Side effects:
          - Updates lead status to 'lost'
          - Sets researched_by to current user
          - Sets research_completed_at to now
          - Sets disqualification_reason
          - Creates ASELeadActivity (type='status_change')

        Returns:
          200 with serialized lead data on success
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/ase-leads/{id}/log-call/:
    post:
      operationId: api_ase_leads_log_call_create
      description: |-
        Log a call against a lead.

        Request body:
          - title (required, string): Brief summary of the call
          - description (optional, string): Detailed notes about the call
          - call_duration_minutes (optional, integer): Duration of the call in minutes
          - call_outcome (optional, string): Outcome of the call (answered, voicemail, etc.)
          - requires_followup (optional, boolean): Whether a follow-up is needed
          - followup_date (optional, datetime): When the follow-up is due

        Validations:
          - Lead must exist (404 if not found)
          - User must have BOE access (403 if not)
          - title must be provided (400 if missing)
          - call_duration_minutes must be a non-negative integer if provided (400 if invalid)

        Side effects:
          - Creates ASELeadActivity (type='call')
          - Increments lead.total_calls_made
          - Updates lead.last_engagement_type = 'call'
          - Updates lead.last_engagement_date = now

        Returns:
          201 with serialized activity data on success
      parameters:
      - in: path
