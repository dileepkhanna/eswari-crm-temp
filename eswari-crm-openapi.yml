  /api/activity-logs/:
    get:
      operationId: api_activity_logs_list
      description: |-
        ViewSet for viewing and creating activity logs.
        All authenticated users can create activity logs.
        Only admins can view all activity logs.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityLogList'
          description: ''
    post:
      operationId: api_activity_logs_create
      description: Override create to ensure proper user assignment and logging
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityLogRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivityLogRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivityLogRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLog'
          description: ''
